<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade de Ciências – 7º Ano – 3º Bimestre</title>
<style>
  :root{
    --azul-escuro:#14324a;
    --azul-medio:#1c5c86;
    --verde-escuro:#1b5e20;
    --verde-escuro-hover:#164a19;
    --cinza-claro:#f4f6f8;
    --cinza-borda:#d7dee4;
    --texto:#233140;
    --amarelo:#ffb703;
    --vermelho:#b3261e;
    --vermelho-hover:#8c1c16;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--azul-escuro);
    color:var(--texto);
    padding-bottom:60px;
  }

  /* ===== CABEÇALHO PADRÃO DA ESCOLA ===== */
  header.escola{
    background:linear-gradient(160deg, var(--azul-escuro) 0%, #1a3f5c 100%);
    color:#fff;
    padding:26px 18px 40px;
    text-align:center;
    position:relative;
    border-radius:0 0 32px 32px;
    box-shadow:0 10px 24px rgba(14,36,54,.28);
  }
  header.escola h1{
    margin:0 0 4px;
    font-size:1.35rem;
    letter-spacing:.5px;
  }
  header.escola h2{
    margin:0;
    font-weight:400;
    font-size:1rem;
    opacity:.9;
  }

  .identificacao{
    max-width:1200px;
    width:94%;
    margin:22px auto 0;
    background:#fff;
    border-radius:16px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 18px 26px -14px rgba(20,50,74,.45),
      0 4px 10px rgba(20,50,74,.10);
    padding:22px 24px;
    position:relative;
  }
  .identificacao h3{
    margin:0 0 14px;
    color:var(--azul-escuro);
    font-size:1.05rem;
    border-bottom:2px solid var(--cinza-borda);
    padding-bottom:8px;
  }
  .grid-id{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
  }
  @media(max-width:900px){ .grid-id{grid-template-columns:1fr 1fr;} }
  @media(max-width:560px){ .grid-id{grid-template-columns:1fr;} }
  .campo{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .campo label{ font-size:.82rem; font-weight:600; color:var(--azul-escuro); }
  .campo select, .campo input{
    width:100%;
    max-width:100%;
    min-width:0;
    padding:10px 12px;
    border-radius:9px;
    border:1px solid var(--cinza-borda);
    background:var(--cinza-claro);
    font-size:.95rem;
    color:var(--texto);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .campo input[readonly]{
    background:#eef3f7;
    color:#54606c;
  }
  #statusAluno{
    margin-top:12px;
    font-size:.85rem;
    color:#54606c;
  }

  main{
    max-width:1200px;
    width:94%;
    margin:26px auto;
    padding:0 16px;
  }

  .questao{
    background:#fff;
    border-radius:14px;
    padding:24px 28px 28px;
    margin-bottom:26px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 16px 24px -14px rgba(20,50,74,.35),
      0 3px 8px rgba(20,50,74,.08);
    border:1px solid #eef1f4;
    transition:box-shadow .15s ease;
  }
  .questao .tag{
    display:inline-block;
    background:var(--azul-medio);
    color:#fff;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.4px;
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .questao .tag.dissertativa{ background:var(--amarelo); color:#4a3300; }
  .questao h4{
    margin:0 0 4px;
    font-size:1rem;
    color:var(--azul-escuro);
  }
  .questao p.enunciado{
    margin:6px 0 14px;
    line-height:1.55;
    font-size:.96rem;
  }

  .imagem-questao{
    display:flex;
    justify-content:center;
    margin:12px 0 16px;
    width:100%;
  }
  .imagem-questao svg,
  .imagem-questao img{
    width:100%;
    max-width:100%;
    height:auto;
    border-radius:12px;
    background:#eaf4fb;
    padding:10px;
    object-fit:contain;
    display:block;
    cursor:zoom-in;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .imagem-questao svg:hover,
  .imagem-questao img:hover{
    transform:scale(1.015);
    box-shadow:0 8px 20px rgba(20,50,74,.18);
  }
  .imagem-questao img{
    padding:10px;
    background:#eaf4fb;
    max-height:640px;
    object-fit:contain;
  }

  /* ===== LIGHTBOX (ampliar imagem ao clicar) ===== */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(10,20,30,.88);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
    cursor:zoom-out;
  }
  .lightbox.ativo{ display:flex; }
  .lightbox-conteudo{
    max-width:min(92vw, 1100px);
    max-height:90vh;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:lightbox-zoom .18s ease;
  }
  .lightbox-conteudo img,
  .lightbox-conteudo svg{
    max-width:100%;
    max-height:90vh;
    width:auto;
    height:auto;
    border-radius:14px;
    background:#eaf4fb;
    padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
  }
  .lightbox-fechar{
    position:fixed;
    top:18px; right:22px;
    width:42px; height:42px;
    border-radius:50%;
    border:none;
    background:#fff;
    color:var(--azul-escuro);
    font-size:1.4rem;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.3);
    z-index:101;
  }
  .lightbox-dica{
    position:fixed;
    bottom:20px; left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:.82rem;
    opacity:.8;
    z-index:101;
  }
  @keyframes lightbox-zoom{
    from{ opacity:0; transform:scale(.92); }
    to{ opacity:1; transform:scale(1); }
  }
  .imagem-questao .imagem-erro{
    width:100%;
    max-width:100%;
    min-height:180px;
    border-radius:12px;
    background:#eaf4fb;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#54606c;
    font-size:.82rem;
    text-align:center;
    padding:14px;
  }

  .pergunta{
    font-weight:600;
    margin:10px 0 12px;
  }

  .alternativas{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .alt{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 16px;
    border-radius:12px;
    background:linear-gradient(145deg,#ffffff,#e8edf1);
    box-shadow:
      6px 6px 12px rgba(163,177,198,.5),
      -6px -6px 12px rgba(255,255,255,.85);
    border:1px solid #eef1f4;
    cursor:pointer;
    font-size:.94rem;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease;
    user-select:none;
  }
  .alt:hover{ transform:translateY(-1px); }
  .alt .letra{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--azul-medio);
    color:#fff;
    font-weight:700;
    font-size:.8rem;
    display:flex; align-items:center; justify-content:center;
  }
  .alt.selecionada{
    background:var(--verde-escuro);
    color:#fff;
    font-weight:700;
    box-shadow:
      inset 4px 4px 8px rgba(0,0,0,.35),
      inset -4px -4px 8px rgba(255,255,255,.06);
    transform:translateY(1px) scale(.99);
    border-color:var(--verde-escuro-hover);
  }
  .alt.selecionada .letra{
    background:#fff;
    color:var(--verde-escuro);
  }

  textarea.resposta-dissertativa{
    width:100%;
    min-height:110px;
    border-radius:12px;
    border:1px solid var(--cinza-borda);
    padding:12px 14px;
    font-family:inherit;
    font-size:.94rem;
    resize:vertical;
    background:var(--cinza-claro);
  }
  .contador{
    text-align:right;
    font-size:.75rem;
    color:#8492a0;
    margin-top:4px;
  }

  .barra-envio{
    max-width:1200px;
    width:94%;
    margin:0 auto;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .botoes-envio{
    width:100%;
    display:flex;
    justify-content:center;
    gap:12px;
  }
  @media(max-width:560px){
    .botoes-envio{ flex-direction:column; }
    #btnEnviar, #btnExcluir{ width:100%; }
  }
  #btnEnviar{
    flex:0 0 auto;
    width:auto;
    min-width:200px;
    padding:14px 26px;
    border:none;
    border-radius:14px;
    background:var(--azul-escuro);
    color:#fff;
    font-size:1.02rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(20,50,74,.3);
    transition:background .15s ease, transform .1s ease;
  }
  #btnEnviar:hover{ background:#0e2436; }
  #btnEnviar:disabled{ background:#93a3b0; cursor:not-allowed; box-shadow:none; }

  #btnExcluir{
    flex:0 0 auto;
    padding:14px 22px;
    border:2px solid var(--vermelho);
    border-radius:14px;
    background:#fff;
    color:var(--vermelho);
    font-size:1.02rem;
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  #btnExcluir:hover{ background:var(--vermelho); color:#fff; }
  #btnExcluir:disabled{ border-color:#c7ccd1; color:#93a3b0; cursor:not-allowed; background:#fff; }

  #msgEnvio{
    font-size:.9rem;
    text-align:center;
    min-height:20px;
  }
  #msgEnvio.erro{ color:#b3261e; font-weight:600; }
  #msgEnvio.sucesso{ color:var(--verde-escuro); font-weight:700; }
  #msgEnvio.aviso{ color:#8a5a2b; font-weight:600; }

  .overlay-sucesso{
    position:fixed; inset:0;
    background:rgba(20,50,74,.92);
    display:none;
    align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .overlay-sucesso.ativo{ display:flex; }
  .caixa-sucesso{
    background:#fff;
    border-radius:16px;
    padding:32px 26px;
    max-width:420px;
    text-align:center;
  }
  .caixa-sucesso h3{ color:var(--verde-escuro); margin-top:0; }
  .caixa-sucesso .nota{
    font-size:2.4rem;
    font-weight:800;
    color:var(--azul-escuro);
    margin:10px 0;
  }

  /* ===== AJUSTES RESPONSIVOS PARA TELAS PEQUENAS (CELULARES) ===== */
  @media(max-width:600px){
    header.escola{ padding:20px 14px 32px; border-radius:0 0 22px 22px; }
    header.escola h1{ font-size:1.1rem; }
    header.escola h2{ font-size:.88rem; }

    .identificacao{ width:92%; padding:16px 14px; margin-top:16px; }
    .identificacao h3{ font-size:.98rem; }

    main{ width:92%; padding:0 10px; margin:18px auto; }

    .questao{ padding:16px 14px 20px; border-radius:12px; margin-bottom:18px; }
    .questao h4{ font-size:.92rem; }
    .questao p.enunciado{ font-size:.9rem; }
    .questao .tag{ font-size:.66rem; padding:3px 9px; }

    .imagem-questao img{ max-height:280px; }

    .alt{ padding:11px 13px; font-size:.9rem; }
    .alt .letra{ width:22px; height:22px; font-size:.72rem; }

    textarea.resposta-dissertativa{ font-size:.9rem; padding:10px 12px; }

    #btnEnviar, #btnExcluir{ min-width:0; padding:13px 18px; font-size:.96rem; }

    .lightbox{ padding:12px; }
    .lightbox-fechar{ top:10px; right:10px; width:38px; height:38px; font-size:1.25rem; }
    .lightbox-dica{ bottom:12px; font-size:.72rem; }
  }

  @media(max-width:360px){
    header.escola h1{ font-size:1rem; }
    .grid-id{ gap:10px; }
    .questao{ padding:14px 12px 18px; }
  }
</style>
</head>
<body>

<header class="escola">
  <h1>E.E. PROFª WANDA MASCAGNI DE SÁ</h1>
  <h2>Atividade Avaliativa de Ciências — 7º Ano — 3º Bimestre</h2>
</header>

<section class="identificacao">
  <h3>Identificação do Aluno</h3>
  <div class="grid-id">
    <div class="campo">
      <label for="selTurma">Turma</label>
      <select id="selTurma">
        <option value="">Selecione a turma...</option>
        <option value="7º Ano A">7º Ano A</option>
        <option value="7º Ano B">7º Ano B</option>
      </select>
    </div>
    <div class="campo">
      <label for="selNome">Nome do Aluno</label>
      <select id="selNome" disabled>
        <option value="">Selecione a turma primeiro...</option>
      </select>
    </div>
    <div class="campo">
      <label for="inRA">RA</label>
      <input type="text" id="inRA" readonly placeholder="Preenchido automaticamente">
    </div>
    <div class="campo">
      <label for="inChamada">Nº de chamada</label>
      <input type="text" id="inChamada" readonly placeholder="Preenchido automaticamente">
    </div>
  </div>
  <div id="statusAluno">Selecione a turma e depois o nome para carregar seus dados.</div>
</section>

<main id="areaQuestoes"></main>

<div class="barra-envio">
  <div class="botoes-envio">
    <button id="btnEnviar" disabled>Enviar Atividade</button>
    <button id="btnExcluir" type="button">Excluir Respostas</button>
  </div>
  <div id="msgEnvio"></div>
</div>

<div class="overlay-sucesso" id="overlaySucesso">
  <div class="caixa-sucesso">
    <h3>Atividade enviada! ✅</h3>
    <p id="mensagemFinal">Suas respostas foram registradas com sucesso.</p>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-fechar" id="lightboxFechar" type="button" aria-label="Fechar imagem ampliada">&times;</button>
  <div class="lightbox-conteudo" id="lightboxConteudo"></div>
  <div class="lightbox-dica">Clique em qualquer lugar para fechar</div>
</div>

/* =====================================================================
   RENDERIZAÇÃO DAS QUESTÕES
   ===================================================================== */
const areaQuestoes = document.getElementById('areaQuestoes');
const respostas = {};

function renderImagemQuestao(imagem, textoAlternativo){
  if(!imagem) return '';

  const ehSvgInline = /^\s*<svg[\s>]/i.test(imagem);
  if(ehSvgInline){
    return imagem;
  }

  const alt = (textoAlternativo || 'Ilustração da questão').replace(/"/g, '&quot;');
  return `<img src="${imagem}" alt="${alt}" loading="lazy"
            onerror="this.outerHTML='<div class=\\'imagem-erro\\'>Não foi possível carregar a imagem desta questão.</div>'">`;
}

QUESTOES.forEach((q, idx) => {
  const card = document.createElement('div');
  card.className = 'questao';

  const tagClasse = q.tipo === 'dissertativa' ? 'tag dissertativa' : 'tag';
  const tagTexto = q.tipo === 'dissertativa' ? 'DISSERTATIVA' : 'MÚLTIPLA ESCOLHA';

  let html = `
    <span class="${tagClasse}">${tagTexto} · Questão ${idx+1}</span>
    <h4>${q.aula}</h4>
    <p class="enunciado">${q.enunciado}</p>
    <div class="imagem-questao">${renderImagemQuestao(q.imagem, q.aula)}</div>
    <p class="pergunta">${q.pergunta}</p>
  `;

  if(q.tipo === 'objetiva'){
    html += `<div class="alternativas" data-qid="${q.id}">`;
    q.alternativas.forEach(alt => {
      html += `<div class="alt" data-letra="${alt.letra}">
                 <span class="letra">${alt.letra}</span>
                 <span class="texto-alt">${alt.texto}</span>
               </div>`;
    });
    html += `</div>`;
  } else {
    html += `<textarea class="resposta-dissertativa" id="${q.id}" placeholder="${q.placeholder}" maxlength="900"></textarea>
              <div class="contador"><span id="cont-${q.id}">0</span>/900 caracteres</div>`;
  }

  card.innerHTML = html;
  areaQuestoes.appendChild(card);
});

document.querySelectorAll('.alternativas').forEach(grupo => {
  grupo.addEventListener('click', (e) => {
    const altEl = e.target.closest('.alt');
    if(!altEl) return;
    grupo.querySelectorAll('.alt').forEach(a => a.classList.remove('selecionada'));
    altEl.classList.add('selecionada');
    respostas[grupo.dataset.qid] = altEl.dataset.letra;
    validarFormulario();
  });
});

QUESTOES.filter(q => q.tipo === 'dissertativa').forEach(q => {
  const ta = document.getElementById(q.id);
  const cont = document.getElementById('cont-' + q.id);
  ta.addEventListener('input', () => {
    cont.textContent = ta.value.length;
    respostas[q.id] = ta.value;
    validarFormulario();
  });
});

/* =====================================================================
   LIGHTBOX — amplia a imagem da questão ao clicar
   ===================================================================== */
const lightbox = document.getElementById('lightbox');
const lightboxConteudo = document.getElementById('lightboxConteudo');
const lightboxFechar = document.getElementById('lightboxFechar');

function abrirLightbox(elementoOriginal){
  lightboxConteudo.innerHTML = '';
  const clone = elementoOriginal.cloneNode(true);
  clone.removeAttribute('onerror');
  clone.style.cursor = 'default';
  lightboxConteudo.appendChild(clone);
  lightbox.classList.add('ativo');
  document.body.style.overflow = 'hidden';
}

function fecharLightbox(){
  lightbox.classList.remove('ativo');
  lightboxConteudo.innerHTML = '';
  document.body.style.overflow = '';
}

document.querySelectorAll('.imagem-questao').forEach(container => {
  container.addEventListener('click', (e) => {
    const alvo = container.querySelector('img, svg');
    if(!alvo) return;
    abrirLightbox(alvo);
  });
});

lightbox.addEventListener('click', fecharLightbox);
lightboxFechar.addEventListener('click', (e) => {
  e.stopPropagation();
  fecharLightbox();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && lightbox.classList.contains('ativo')) fecharLightbox();
});

/* =====================================================================
   IDENTIFICAÇÃO DO ALUNO — TURMA -> NOME (dropdowns em cascata)
   ===================================================================== */
let alunoSelecionado = null;

const selTurma = document.getElementById('selTurma');
const selNome = document.getElementById('selNome');
const inRA = document.getElementById('inRA');
const inChamada = document.getElementById('inChamada');
const statusAluno = document.getElementById('statusAluno');

selTurma.addEventListener('change', () => {
  inRA.value = ''; inChamada.value = '';
  alunoSelecionado = null;
  validarFormulario();

  if(!selTurma.value){
    selNome.innerHTML = '<option value="">Selecione a turma primeiro...</option>';
    selNome.disabled = true;
    statusAluno.textContent = 'Selecione a turma e depois o nome para carregar seus dados.';
    return;
  }

  const alunosDaTurma = LISTA_ALUNOS.filter(a => a.turma === selTurma.value);
  if(alunosDaTurma.length === 0){
    selNome.innerHTML = '<option value="">Nenhum aluno encontrado</option>';
    selNome.disabled = true;
    statusAluno.textContent = 'Nenhum aluno encontrado para esta turma.';
    return;
  }

  const alunosOrdenados = [...alunosDaTurma].sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  selNome.innerHTML = '<option value="">Selecione seu nome...</option>' +
    alunosOrdenados.map((a,i) => `<option value="${i}">${a.nome}</option>`).join('');
  selNome.disabled = false;
  statusAluno.textContent = 'Selecione seu nome na lista.';
  selNome._alunos = alunosOrdenados;
});

selNome.addEventListener('change', () => {
  const idx = selNome.value;
  if(idx === ''){
    alunoSelecionado = null;
    inRA.value=''; inChamada.value='';
    statusAluno.textContent = 'Selecione seu nome na lista.';
    validarFormulario();
    return;
  }
  alunoSelecionado = selNome._alunos[idx];
  inRA.value = alunoSelecionado.ra || '';
  inChamada.value = alunoSelecionado.chamada || '';
  statusAluno.textContent = `Aluno(a): ${alunoSelecionado.nome} — dados carregados com sucesso.`;
  validarFormulario();
});

/* =====================================================================
   VALIDAÇÃO, ENVIO E EXCLUSÃO DE RESPOSTAS
   ===================================================================== */
const btnEnviar = document.getElementById('btnEnviar');
const btnExcluir = document.getElementById('btnExcluir');
const msgEnvio = document.getElementById('msgEnvio');

function validarFormulario(){
  const objetivas = QUESTOES.filter(q => q.tipo === 'objetiva');
  const dissertativas = QUESTOES.filter(q => q.tipo === 'dissertativa');

  const todasObjetivasRespondidas = objetivas.every(q => respostas[q.id]);
  const todasDissertativasRespondidas = dissertativas.every(q => (respostas[q.id]||'').trim().length >= 10);
  const identificado = !!alunoSelecionado;

  const ok = identificado && todasObjetivasRespondidas && todasDissertativasRespondidas;
  btnEnviar.disabled = !ok;
  return ok;
}

btnEnviar.addEventListener('click', async () => {
  if(!validarFormulario()){
    msgEnvio.className = 'erro';
    msgEnvio.textContent = 'Preencha sua identificação e responda todas as questões antes de enviar.';
    return;
  }

  btnEnviar.disabled = true;
  btnExcluir.disabled = true;
  btnEnviar.textContent = 'Enviando e corrigindo com IA...';
  msgEnvio.className = '';
  msgEnvio.textContent = '';

  const payload = {
    nome: alunoSelecionado.nome,
    turma: selTurma.value,
    ra: alunoSelecionado.ra,
    email: alunoSelecionado.email || '',
    chamada: alunoSelecionado.chamada || '',
    answers: {
      q1: respostas.q1 || '', q2: respostas.q2 || '', q3: respostas.q3 || '',
      q4: respostas.q4 || '', q5: respostas.q5 || '', q6: respostas.q6 || '', q7: respostas.q7 || '',
      q8: respostas.q8 || '', q9: respostas.q9 || '', q10: respostas.q10 || ''
    }
  };

  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();

    if(data.ok){
      document.getElementById('mensagemFinal').textContent = data.message;
      document.getElementById('overlaySucesso').classList.add('ativo');
      msgEnvio.className = 'sucesso';
      msgEnvio.textContent = data.message;
    } else {
      throw new Error(data.error || 'Erro desconhecido ao enviar a atividade.');
    }
  }catch(err){
    msgEnvio.className = 'erro';
    msgEnvio.textContent = 'Erro ao enviar: ' + err.message + '. Tente novamente.';
    btnEnviar.disabled = false;
    btnExcluir.disabled = false;
    btnEnviar.textContent = 'Enviar Atividade';
  }
});

btnExcluir.addEventListener('click', () => {
  const temRespostas = Object.keys(respostas).some(k => (respostas[k] || '').toString().trim() !== '');
  if(!temRespostas){
    msgEnvio.className = 'aviso';
    msgEnvio.textContent = 'Não há respostas preenchidas para excluir.';
    return;
  }

  const confirmar = window.confirm('Tem certeza que deseja excluir todas as respostas já preenchidas? Esta ação não pode ser desfeita.');
  if(!confirmar) return;

  document.querySelectorAll('.alt.selecionada').forEach(a => a.classList.remove('selecionada'));

  QUESTOES.filter(q => q.tipo === 'dissertativa').forEach(q => {
    const ta = document.getElementById(q.id);
    const cont = document.getElementById('cont-' + q.id);
    if(ta) ta.value = '';
    if(cont) cont.textContent = '0';
  });

  Object.keys(respostas).forEach(k => delete respostas[k]);

  msgEnvio.className = 'aviso';
  msgEnvio.textContent = 'Todas as respostas foram excluídas. Você pode preencher a atividade novamente.';

  validarFormulario();
});
</script>
